name: self-hosted-llm

services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    restart: always
    environment:
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - llm

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    ports:
      # Listen on all host interfaces. WireGuard DNATs 10.0.2.3:3060
      # (BACKEND_PORT) here; the host has no 10.0.2.x address.
      - "0.0.0.0:3060:8080"
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
    volumes:
      - open-webui_data:/app/backend/data
    depends_on:
      - ollama
    networks:
      - llm

volumes:
  ollama_data:
    name: ollama_data
  open-webui_data:
    name: open-webui_data

networks:
  llm:
    name: self-hosted-llm
