name: self-hosted-llm

services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    profiles: [ollama]
    restart: always
    ports:
      - "0.0.0.0:${OLLAMA_PORT:-11434}:11434"
    environment:
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=30m
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - llm

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    profiles: [open-webui]
    restart: always
    ports:
      - "0.0.0.0:${WEBUI_PORT:-3060}:8080"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST=60
    volumes:
      - open-webui_data:/app/backend/data
    networks:
      - llm

volumes:
  ollama_data:
    name: ollama_data
  open-webui_data:
    name: open-webui_data

networks:
  llm:
    name: self-hosted-llm
